name: build

# 每次提交都验证并构建镜像；只有 main 和 tag 才推 ghcr。
# PR 上只构建不推送 —— 保证 fork PR 拿不到写包权限也能跑完。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_SERVER: ghcr.io/${{ github.repository }}
  IMAGE_LAMBDA: ghcr.io/${{ github.repository }}-lambda

jobs:
  verify:
    name: lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # Dockerfile 是 `COPY ./dist /app`，不在镜像里编译。把 dist/ 传给下游 job，
      # 省一次重复构建，也保证推出去的镜像和这里验证过的产物是同一份。
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  image:
    name: docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # tag 触发才做多架构：arm64 走 QEMU 模拟，装原生依赖（sharp）很慢，
      # 不值得每次提交都付这个时间。日常只验 amd64。
      - name: decide platforms
        id: plat
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/setup-buildx-action@v3

      - name: login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags for server image
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SERVER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: tags for lambda image
        id: meta_lambda
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LAMBDA }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./lambda.Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_lambda.outputs.tags }}
          labels: ${{ steps.meta_lambda.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        run: |
          {
            echo "### 镜像"
            echo ""
            echo "platforms: \`${{ steps.plat.outputs.platforms }}\`"
            echo "pushed: \`${{ github.event_name != 'pull_request' }}\`"
            echo ""
            echo "server:"
            echo '```'
            echo "${{ steps.meta_server.outputs.tags }}"
            echo '```'
            echo "lambda:"
            echo '```'
            echo "${{ steps.meta_lambda.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
