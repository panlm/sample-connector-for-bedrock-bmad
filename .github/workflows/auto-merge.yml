# Auto-merge for pipeline-authored PRs.
#
# Why this lives in CI and not in the agent: agents cannot edit .github/ (blocked by the
# PreToolUse guardrail) and the runtime host's gh token has no `workflow` scope. So the
# merge policy is the one thing the pipeline provably cannot rewrite. Adding more regexes
# to the guardrail would only chase bypasses; moving the decision here removes the need.
#
# Fail-closed: every gate below must pass. A PR that does not declare the paths it owns
# is never auto-merged.
name: auto-merge

on:
  # Labelling is a second, independent entry point, and it is required rather
  # than convenient: the `auto-merge` label is granted by the review stage, which
  # by construction finishes AFTER the build. With only the workflow_run trigger
  # the gate always evaluated before the label existed, declined with "no
  # auto-merge label", and nothing ever re-evaluated — so nothing merged at all.
  #
  # pull_request_target, not pull_request: it takes the workflow definition from
  # the base branch, so this applies to PRs that are already open. It is safe
  # here because this job never checks out PR code — it only reads metadata and
  # calls the merge API.
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # Either entry point may open the gate. Both still pass through every check
    # below, so a label alone merges nothing — it only asks the question again.
    if: >-
      (github.event_name == 'pull_request_target' && github.event.label.name == 'auto-merge')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the PR under evaluation
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          LABELED_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Labelled path: the PR number is handed to us directly.
          if [ -n "${LABELED_PR:-}" ]; then
            echo "evaluating #$LABELED_PR (label added)"
            echo "number=$LABELED_PR" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefOid \
                --jq "[.[]|select(.headRefOid==\"$SHA\")][0].number // empty")
          if [ -z "$n" ]; then echo "no open PR at $SHA — nothing to do"; echo "skip=1" >>"$GITHUB_OUTPUT"; exit 0; fi
          echo "number=$n" >>"$GITHUB_OUTPUT"

      - name: Gate and merge
        if: steps.pr.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ steps.pr.outputs.number }}
          # `gh pr checks` reports this job under its job name. Pass it in so the
          # gate can exclude itself rather than deadlock on its own IN_PROGRESS.
          SELF_CHECK: ${{ github.job }}
        run: |
          set -euo pipefail
          # GitHub computes `mergeable` asynchronously. Right after a PR opens (or
          # after main moves) it is UNKNOWN for a few seconds, and the gate below
          # denies on anything that is not MERGEABLE. Reading it once therefore
          # strands a perfectly good PR forever: auto-merge only fires on
          # workflow_run, which has already happened, so nothing ever retries.
          # Observed in run 1 — `auto-merge declined for #1: mergeable=UNKNOWN`
          # on a PR whose checks were all green. Poll until GitHub commits to an
          # answer; still fail closed if it never does.
          for attempt in 1 2 3 4 5 6; do
            gh pr view "$N" --repo "$GITHUB_REPOSITORY" \
              --json number,headRefName,baseRefName,labels,mergeable,mergeStateStatus,body,files,isCrossRepository \
              > pr.json
            m="$(python3 -c 'import json;print(json.load(open("pr.json"))["mergeable"])')"
            [ "$m" != "UNKNOWN" ] && break
            echo "::notice::mergeable=UNKNOWN for #$N, attempt $attempt/6 — waiting for GitHub to compute it"
            sleep 5
          done
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          pr = json.load(open("pr.json"))
          n  = pr["number"]
          def deny(msg):
              print(f"::notice::auto-merge declined for #{n}: {msg}")
              sys.exit(0)          # declining is not a build failure
          # 1) only pipeline-authored branches, never a fork
          if pr["isCrossRepository"]:            deny("cross-repository PR")
          if not pr["headRefName"].startswith("agent/"): deny(f'head {pr["headRefName"]} is not agent/*')
          if pr["baseRefName"] != "main":        deny(f'base is {pr["baseRefName"]}, not main')
          # 2) explicit opt-in label
          labels = {l["name"] for l in pr["labels"]}
          if "auto-merge" not in labels:         deny("no auto-merge label")
          # 3) textually clean
          if pr["mergeable"] != "MERGEABLE":     deny(f'mergeable={pr["mergeable"]}')
          if pr["mergeStateStatus"] in ("DIRTY", "BLOCKED", "BEHIND"):
              deny(f'mergeStateStatus={pr["mergeStateStatus"]}')
          # 4) every check run on the head must be green (build + ci + anything else)
          out = subprocess.run(["gh","pr","checks",str(n),"--repo",os.environ["GITHUB_REPOSITORY"],
                                "--json","name,state"],capture_output=True,text=True)
          if out.returncode != 0 or not out.stdout.strip():
              deny(f"cannot read check status (rc={out.returncode}) — refusing to merge blind")
          # Exclude this job's own check. Under the pull_request_target entry
          # point this workflow is itself a check on the PR, so it observes its
          # own IN_PROGRESS state and refuses to merge — it would deadlock on
          # itself, forever, on a PR that is otherwise green.
          SELF = os.environ.get("SELF_CHECK", "")
          checks = [c for c in json.loads(out.stdout) if c["name"] != SELF]
          bad = [c for c in checks if c["state"] not in ("SUCCESS","SKIPPED","NEUTRAL")]
          if bad: deny("checks not green: " + ", ".join(f'{c["name"]}={c["state"]}' for c in bad))
          if not checks: deny("no checks other than this one — refusing to merge unverified")
          # 5) fail-closed path ownership: PR body must declare what it owns
          #
          # The declaration is matched permissively on purpose. Being strict here
          # bought nothing and cost real work: two run-4 PRs declared correctly and
          # still stalled, because the author copied the line out of a fenced
          # example and decorated it —
          #   #19  `Auto-merge-paths: package.json`   (wrapped in backticks)
          #   #16  ### Auto-merge-paths               (heading + fenced path list)
          # Relaxing the *parse* cannot approve anything wrong: whatever is found
          # still has to cover every changed file in the check below, or we deny.
          def _undecorate(s):
              return s.strip().lstrip("#>*-+ \t").strip().strip("`").strip()

          body_lines = (pr.get("body") or "").splitlines()
          owns, found_marker = [], False
          for i, raw in enumerate(body_lines):
              line = _undecorate(raw)
              if not line.lower().startswith("auto-merge-paths"): continue
              found_marker = True
              rest = line.split(":", 1)[1] if ":" in line else ""
              if rest.strip():
                  owns = [p.strip().strip("`") for p in rest.split(",") if p.strip().strip("`")]
                  break
              # Heading form: collect paths from the lines that follow, skipping
              # blanks and fence markers, stopping at the next heading/quote.
              for nxt in body_lines[i+1:]:
                  t = nxt.strip()
                  if not t or t.startswith("```"): continue
                  if t.startswith("#") or t.startswith(">"): break
                  cand = [p.strip().strip("`") for p in _undecorate(nxt).split(",")]
                  cand = [p for p in cand if p and "/" in p or p.endswith((".json",".js",".ts",".md",".yml",".yaml"))]
                  if not cand: break
                  owns += cand
              break
          if not owns:
              deny("PR body has no usable `Auto-merge-paths:` declaration"
                   + (" — found the marker but no paths after it" if found_marker
                      else " — expected a line `Auto-merge-paths: <glob>, <glob>`"))
          # Path-aware glob: `*` must NOT cross a directory separator, otherwise a
          # declaration that reads as narrow (`src/*`) silently matches `src/a/b/c.ts`
          # and the ownership gate stops being a concurrency boundary at all.
          # `**` is the explicit opt-in for recursion.
          def _glob_re(g):
              out, i = "", 0
              while i < len(g):
                  if g.startswith("**/", i):  out += "(?:.*/)?"; i += 3
                  elif g.startswith("**", i): out += ".*";       i += 2
                  elif g[i] == "*":           out += "[^/]*";    i += 1
                  elif g[i] == "?":           out += "[^/]";     i += 1
                  else:                       out += re.escape(g[i]); i += 1
              return re.compile("\\A" + out + "\\Z")
          pats = [_glob_re(g) for g in owns]
          changed = [f["path"] for f in pr["files"]]
          stray = [p for p in changed if not any(r.match(p) for r in pats)]
          if stray:
              deny(f'{len(stray)} of {len(changed)} file(s) outside declared ownership: {stray[:6]}'
                   + (" ..." if len(stray) > 6 else ""))
          print(f"::notice::auto-merge gates passed for #{n}; {len(changed)} file(s) within {owns}")
          open("/tmp/go","w").write("go")   # 所有闸门通过的唯一信号
          PY
          if [ -f /tmp/go ]; then
            gh pr merge "$N" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "merged #$N"
          fi
